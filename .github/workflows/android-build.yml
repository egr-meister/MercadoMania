name: Android Release Build

# Builds a signed release APK (for testing) and AAB (for Google Play).
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the PKCS12 keystore file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#
# Nothing in this workflow echoes a secret: the keystore is decoded straight to
# a file, and the passwords only ever travel as environment variables.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK Platform 36 and Build Tools 36.0.0
        # The runner image already ships the Android SDK and command-line
        # tools, so this uses them directly instead of android-actions/
        # setup-android, whose license step drops into an interactive
        # "Accept? (y/N)" prompt and fails the job.
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT"
            exit 1
          fi
          echo "Using $SDKMANAGER"

          # Accept licenses non-interactively. `yes` gets SIGPIPE when
          # sdkmanager stops reading, which is expected, hence the guard.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Provision Gradle
        # A fixed Gradle version is provisioned here, so a committed
        # gradle-wrapper.jar is not required for CI to work.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret for $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Release builds must be signed with the real keystore. Refusing to continue."
            exit 1
          fi

      # A release built without these secrets looks healthy and is only caught weeks
      # later in the tracker reports: no OFFER_BASE_URL -> all White; no ADJUST_APP_TOKEN
      # -> no attribution; no GOOGLE_SERVICES_JSON -> no push. So fail the job BEFORE the
      # build.
      - name: Validate integration secrets
        env:
          ADJUST_APP_TOKEN: ${{ secrets.ADJUST_APP_TOKEN }}
          OFFER_BASE_URL: ${{ secrets.OFFER_BASE_URL }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          fail=0
          if [ -z "$ADJUST_APP_TOKEN" ]; then
            echo "::error::ADJUST_APP_TOKEN is not set - the build would ship with no attribution."
            fail=1
          fi
          if [ -z "$OFFER_BASE_URL" ]; then
            echo "::error::OFFER_BASE_URL is not set - the build would be all White."
            fail=1
          else
            case "$OFFER_BASE_URL" in
              http://*|https://*) ;;
              *) echo "::error::OFFER_BASE_URL must start with http:// or https://"; fail=1 ;;
            esac
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set - the build would ship with no push."
            fail=1
          elif ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d 2>/dev/null | grep -q '"project_number"'; then
            echo "::error::GOOGLE_SERVICES_JSON does not decode - it must be base64 of google-services.json."
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1

      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/release.p12"
          if [ ! -s "$RUNNER_TEMP/signing/release.p12" ]; then
            echo "::error::Decoded keystore is empty - check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.p12" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # White/Black integration config. secret() in app/build.gradle.kts reads
          # System.getenv first, so these reach BuildConfig / the Firebase config.
          ADJUST_APP_TOKEN: ${{ secrets.ADJUST_APP_TOKEN }}
          OFFER_BASE_URL: ${{ secrets.OFFER_BASE_URL }}
          OFFER_ROUTING: ${{ secrets.OFFER_ROUTING }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Verify the APK signature and certificate
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          echo "Verifying $APK"

          if ! "$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs "$APK" > certs.txt 2>&1; then
            echo "::error::apksigner verification failed."
            cat certs.txt
            exit 1
          fi
          cat certs.txt

          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the debug key. Release artifacts must use the release keystore."
            exit 1
          fi
          echo "Signature OK - not a debug certificate."

      - name: Verify Firebase project is real (not the stub)
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if "$ANDROID_BUILD_TOOLS/aapt2" dump resources "$APK" | grep -A1 google_app_id | grep -q "000000000000"; then
            echo "::error::APK contains the Firebase STUB (project_number 000000000000) - push will not work."
            exit 1
          fi
          echo "Firebase config is real - not the push-less stub."

      - name: Confirm the AAB exists
        run: |
          set -euo pipefail
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB was produced."
            exit 1
          fi
          echo "Bundle: $AAB"

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/release.p12"

      - name: Upload APK (testing artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mercado-mania-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB (Google Play artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mercado-mania-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # NOTE: a green build here means the project compiles, is signed with a
      # non-debug certificate and produced both artifacts. It is NOT proof that
      # the app launches. Verify locally - see README, "Local release
      # verification".
